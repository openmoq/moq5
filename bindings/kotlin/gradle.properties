# The JDK that RUNS Gradle is not named here: a checked-in path would only work
# on the machine that wrote it. gradle/gradle-daemon-jvm.properties states the
# criterion (Java 21) and Gradle selects a matching JDK through its own
# discovery; the client uses ordinary JAVA_HOME discovery.

# Warnings are a failure, not noise: any Gradle or build-logic deprecation
# fails the lane rather than scrolling past.
org.gradle.warning.mode=fail

# The daemon's own memory, pinned because the canonical lane outgrew the
# defaults (512 MiB heap / 384 MiB metaspace) once it began assembling the
# release AAR, generating publication metadata, running the publication gate
# and its self-test, and building a second Gradle project in the external
# consumer probe. Gradle then warned that the daemon would expire after
# running out of metaspace. The answer is to give it enough, not
# `org.gradle.daemon.performance.disable-logging`, which would hide the
# message while the daemon kept dying (chats/libmoq/1521 F1).
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=768m

org.gradle.parallel=true
org.gradle.caching=true
