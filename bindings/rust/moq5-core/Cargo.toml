[package]
name = "moq5-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Safe Rust API for the libmoq (MOQ5) sans-I/O core"
repository = "https://github.com/openmoq/moq5"
readme = "README.md"
keywords = ["moq", "media-over-quic", "quic", "sans-io"]
categories = ["api-bindings", "network-programming"]
publish = false

[dependencies]
# The core tier only: moq5-sys's default features bind and link the core.
moq5-sys = { version = "0.1.0", path = "../moq5-sys" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"

[package.metadata.docs.rs]
# Documented from moq5-sys's cfg(docsrs) core snapshot, on the targets that
# snapshot is verified on (see moq5-sys/Cargo.toml).
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
