# MoQ5 Android/Kotlin bindings -- the single source of truth for every
# toolchain pin. tools/verify-toolchain.sh, tools/gradlew-verified and the
# Gradle build all read this file; nothing may hard-code a version anywhere
# else.
#
# A PIN IS A VERSION OR A CHECKSUM, NEVER AN INSTALLATION PATH. Nothing here
# names a user, a home directory or an operating system, so the same declaration
# is satisfiable on another developer's machine and on a Linux CI host. Where a
# component lives is DISCOVERED at run time from the standard sources (JAVA_HOME
# or a Gradle daemon-JVM criterion for the JDK; ANDROID_HOME / ANDROID_SDK_ROOT
# / an untracked local.properties for the SDK), and a missing or conflicting
# source fails by name rather than falling back silently.
#
# Every pin below is derived from authoritative vendor metadata, recorded in
# chats/libmoq/1081_android_phase0_1_toolchain_results.md:
#
#   * AGP 9.3.2 is the latest STABLE Android Gradle Plugin
#     (dl.google.com/dl/android/maven2/com/android/tools/build/gradle/
#      maven-metadata.xml -- 9.4.0 is at rc02 and 9.5.0 at alpha03).
#   * developer.android.com/build/releases/gradle-plugin declares, for AGP 9.3:
#     Gradle minimum AND default 9.5.0; SDK Build Tools minimum 36.0.0;
#     NDK default 28.2.13676358; JDK minimum and default 17; max API level 37.
#   * Gradle 9.5.1 is the latest patch of the 9.5 line AGP 9.3 names
#     (services.gradle.org/versions/all).
#   * docs.gradle.org compatibility matrix: Gradle 9.5 runs on Java 17..25, so
#     a JDK 21 satisfies it and AGP's JDK 17 minimum.
#
# A Gradle on PATH is never a prerequisite of this project, and the contract
# rejects being run through one.

# --- Gradle ---------------------------------------------------------------
gradle.version=9.5.1
# SHA-256 of gradle-9.5.1-bin.zip, from services.gradle.org/versions/all.
gradle.distribution.sha256=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f
gradle.distribution.url=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# SHA-256 of the CHECKED-IN gradle/wrapper/gradle-wrapper.jar. tools/gradlew-verified
# checks this BEFORE launching the wrapper, which is the only point at which the
# jar can be verified rather than merely executed.
gradle.wrapper.jar.sha256=497c8c2a7e5031f6aa847f88104aa80a93532ec32ee17bdb8d1d2f67a194a9c7

# --- JDK ------------------------------------------------------------------
# Major version used to RUN Gradle. AGP 9.3 requires >= 17; this project
# standardises on 21, which is also what gradle/gradle-daemon-jvm.properties
# asks Gradle to select for the daemon. WHICH JDK 21 is a host matter.
jdk.major=21

# --- Android Gradle Plugin ------------------------------------------------
agp.version=9.3.2
# AGP 9.3's declared minimum Gradle; gradle.version must be >= this.
agp.minGradle=9.5.0
# AGP 9.3's declared minimum JDK; jdk.major must be >= this.
agp.minJdk=17

# --- Kotlin ----------------------------------------------------------------
# AGP 9 supplies Kotlin itself, so this is NOT a plugin version to apply: it is
# the version AGP's built-in support actually uses, recorded so the test
# framework can be requested at exactly that version. The module ASSERTS this
# pin against the compiler on the build classpath, so a drift fails the build
# rather than silently resolving a mismatched kotlin-test.
kotlin.version=2.2.10

# --- Android SDK ----------------------------------------------------------
sdk.platform=android-36.1
sdk.buildTools=36.1.0
# AGP 9.3's declared minimum build-tools; sdk.buildTools must be >= this.
agp.minBuildTools=36.0.0
sdk.cmdlineTools=23.0
# AGP 9.3's DEFAULT NDK. Pinned explicitly so the build never inherits
# whichever NDK a host tool happens to have installed.
sdk.ndk=28.2.13676358

# --- Kotlin coroutines -----------------------------------------------------
# The engine is a coroutine surface over one dedicated service thread, so the
# coroutines runtime is a REAL runtime dependency of the AAR (implementation),
# and kotlinx-coroutines-test is the test artifact at the same version.
#
# Derived from authoritative Maven Central metadata
# (repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core/
#  maven-metadata.xml -- latest/release 1.11.0; stable line
#  ... 1.10.0, 1.10.1, 1.10.2, 1.11.0).
#
# The pin is NOT simply "latest stable". The selection rule is that no
# transitive kotlin-stdlib may outrank the compiler this project pins, or the
# single-authority guarantee above is silently broken:
#
#   * 1.11.0 declares kotlin-stdlib 2.2.20, and a resolved dependency graph
#     shows `kotlin-stdlib:2.2.10 -> 2.2.20` -- the coroutines release, not
#     this file, would decide the Kotlin runtime version.
#   * 1.10.2 declares kotlin-stdlib 2.1.0, which resolves UP to the pinned
#     2.2.10, so kotlin.version stays authoritative.
#
# Both compile warning-clean against Kotlin 2.2.10; 1.10.2 is chosen because it
# is the newest stable release that leaves the pin in charge. Revisit when
# kotlin.version moves to 2.2.20 or later.
coroutines.version=1.10.2

# --- AndroidX Test (instrumentation only) ---------------------------------
# The Android RUNTIME acceptance gate is the only consumer of these. They are
# androidTest artifacts: they never enter the published AAR, and
# tools/check-android-runtime-declaration.sh asserts that separation.
#
# Derived from authoritative Google Maven metadata
# (dl.google.com/dl/android/maven2/androidx/test/runner/maven-metadata.xml and
#  .../androidx/test/ext/junit/maven-metadata.xml): release 1.7.0 and 1.3.0
# respectively, both stable.
#
# androidx.test:runner supplies AndroidJUnitRunner, the instrumentation the
# module declares; androidx.test.ext:junit supplies the JUnit4 AndroidJUnit4
# runner and InstrumentationRegistry. Nothing else from the AndroidX Test
# family is pinned, because nothing else is used: Espresso, Truth and the
# rules artifact would all be dependencies this slice has not justified.
androidx.test.runner.version=1.7.0
androidx.test.junit.version=1.3.0
