# Daemon JVM criteria (Gradle's own mechanism). A VERSION, not a location:
# Gradle selects a matching JDK through its normal toolchain discovery, so this
# declaration is satisfiable on any host that has a Java 21.
#
# No vendor criterion is declared: pinning one would only be reproducible if
# every developer and CI host installed that exact vendor, which is not a
# property this project can guarantee.
toolchainVersion=21
