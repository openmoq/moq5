[package]
name = "moq5-consumer"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "An out-of-tree consumer of moq5 against an installed SDK"

[features]
# The player, against an SDK built with it (MOQ_BUILD_PLAYBACK=ON).
player = ["moq5/player"]

[dependencies]
moq5 = { path = "../moq5" }

# The core-only consumer is a member of its own: built alone (`-p
# moq5-core-consumer`), its graph asks for the core tier and nothing else.
[workspace]
members = ["core"]
